name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libgl1 xvfb

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Lint check (Ruff)
        run: |
          python -m ruff check src/ tests/

      - name: Static type check (Mypy)
        run: |
          python -m mypy

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -v --cov=src/discord_cleanup --cov-report=term-missing

  build:
    name: Build Windows Executable
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Build standalone executable
        run: |
          pyinstaller discord_cleanup.spec

      - name: Compute SHA256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist/Discord-Mass-Cleanup-Tool.exe").Hash
          "$hash  Discord-Mass-Cleanup-Tool.exe" | Out-File -Encoding ASCII "dist/checksums-sha256.txt"
          Get-Content "dist/checksums-sha256.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/Discord-Mass-Cleanup-Tool.exe
            dist/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
